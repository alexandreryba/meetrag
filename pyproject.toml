[project]
name = "meetrag"
version = "0.1.0"
description = "Multi-agent, multi-source RAG assistant: LangGraph orchestration, hybrid retrieval, text-to-SQL and built-in evaluation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexandre Ryba" }]
requires-python = ">=3.11"
keywords = ["rag", "llm", "agents", "langgraph", "retrieval", "evaluation", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=2.1",
    "fastapi>=0.115",
    "fastembed>=0.7",
    "langgraph>=1.0",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "qdrant-client>=1.12",
    "rich>=13.7",
    "sqlglot>=25.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# Claude on Google Cloud Vertex AI (auth through ADC / the Cloud Run service account).
vertex = ["anthropic[vertex]>=2.1"]
# Any other chat model supported by LangChain (Gemini, OpenAI, Mistral, Ollama...).
langchain = ["langchain>=1.0"]
# Claude through the local Claude Code CLI, on a Claude Pro/Max subscription (local use).
subscription = ["claude-agent-sdk>=0.2"]

[project.scripts]
meetrag = "meetrag.cli:app"

[project.urls]
Repository = "https://github.com/alexandreryba/meetrag"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meetrag"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # naming
    "RUF",      # ruff-specific
    "ASYNC",    # async pitfalls
    "S",        # bandit (security)
    "PTH",      # pathlib
    "TC",       # type-checking imports
]
ignore = ["S101"]  # assert is fine in tests and invariants

[tool.ruff.lint.flake8-type-checking]
# Pydantic models and LangGraph TypedDicts resolve their annotations at runtime.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "typing.TypedDict"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH", "TC"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastembed.*", "qdrant_client.*", "langchain.*", "langchain_core.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["slow: tests that download models or need network"]

[tool.coverage.run]
source = ["meetrag"]
branch = true

[tool.coverage.report]
skip_empty = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
